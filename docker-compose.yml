name: dndvoices

x-app-env: &app-env
  DATABASE_URL: postgresql://dndvoices:dndvoices@postgres:5432/dndvoices
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?define BETTER_AUTH_SECRET en .env}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?define ANTHROPIC_API_KEY en .env}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:?define ELEVENLABS_API_KEY en .env}
  STORAGE_DIR: /app/storage
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
  SIGNUP_ALLOWLIST: ${SIGNUP_ALLOWLIST:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dndvoices
      POSTGRES_PASSWORD: dndvoices
      POSTGRES_DB: dndvoices
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dndvoices"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica las migraciones y termina. web y worker esperan a que salga con 0.
  migrate:
    build:
      context: .
      target: migrate
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    environment: *app-env
    ports:
      - "3000:3000"
    volumes:
      - audio:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Comparte el volumen de audio con web: el worker escribe los clips y la
  # mezcla, y web los sirve tras comprobar la sesión.
  worker:
    build:
      context: .
      target: worker
    environment: *app-env
    volumes:
      - audio:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  audio:
