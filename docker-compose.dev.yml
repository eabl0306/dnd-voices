name: dndvoices-dev

# Sólo la infraestructura. La app se corre en el host con `npm run dev` y
# `npm run worker`, que recargan al guardar.
#
#   docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dndvoices
      POSTGRES_PASSWORD: dndvoices
      POSTGRES_DB: dndvoices
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dndvoices"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
