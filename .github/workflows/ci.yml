name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Tipos, lint y unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # El cliente de Prisma es código generado: sin él no compilan los tipos.
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  e2e:
    name: E2E sobre el stack dockerizado
    runs-on: ubuntu-latest
    # A nivel de job y no de paso: `docker compose logs` también interpola
    # x-app-env, así que sin esto el paso de diagnóstico falla por su cuenta y
    # oculta el error que venía a mostrar.
    env:
      BETTER_AUTH_SECRET: ci-secret-no-usar-en-produccion
      # Los e2e salen todos de la misma IP: con el límite real de producción se
      # estrangularían entre ellos.
      AUTH_RATE_LIMIT_MAX: "1000"
      # Los tests no llegan a llamar a ningún proveedor, pero la validación de
      # entorno exige que las claves existan.
      ANTHROPIC_API_KEY: ci-placeholder
      ELEVENLABS_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Levantar el stack
        run: docker compose up -d --build --wait

      - name: Ejecutar Playwright
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      # Stack aparte, con el límite bajado a un valor que se pueda agotar: en
      # el principal está en 1000 y este control nunca se dispararía.
      - name: Rate limit de autenticación
        run: npm run test:e2e:ratelimit

      - name: Logs de los contenedores si algo falla
        if: failure()
        run: |
          docker compose logs --no-color
          docker compose -f docker-compose.ratelimit.yml logs --no-color

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
